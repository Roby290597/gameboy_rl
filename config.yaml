# Hyperparameter fuer das Super-Mario-Land-RL-Projekt, an einer Stelle
# gesammelt. train_mario.py und watch_agent.py lesen ihre Standardwerte von
# hier - Kommandozeilen-Optionen (z.B. --steps) ueberschreiben weiterhin
# einzelne Werte, falls angegeben.

env:
  # Wie viele Frames pro step()-Aufruf uebersprungen werden (die gewaehlte
  # Aktion bleibt so lange gehalten, bevor Beobachtung/Belohnung berechnet
  # werden). Hoeher = schnelleres Training, aber grobmotorischere Steuerung.
  frame_skip: 4

  # Episode wird abgebrochen (truncated), wenn so viele Schritte am Stueck
  # ohne Fortschritt (level_progress) vergehen.
  max_steps_without_progress: 300

  reward:
    progress: 1.0               # pro Kachel Fortschritt nach rechts (Hauptsignal)
    score: 0.02                 # pro Score-Punkt (Gegner besiegt, Bonusgegenstaende, ...)
    coin: 1.0                   # pro eingesammelter Muenze
    time_penalty: 0.05          # Abzug pro Schritt (Zeitstrafe, damit der Agent nicht troedelt)
    death: 25.0                 # Abzug bei Lebensverlust / Game Over (Episode endet dann)
    # Gezieltes Springen (2026-09-03, auf Vorschlag des Nutzers): Mario soll
    # normal laufen und nur dann springen, wenn tatsaechlich ein Gegner, ein
    # festes Hindernis oder eine Schlucht in den naechsten `jump_lookahead`
    # Spalten VORAUS erkannt wird (siehe mario_env.py-Docstring/_compute_reward).
    # Ist nichts davon der Fall, kostet Springen `jump_cost`; ist etwas davon
    # der Fall, entfaellt die Strafe und es gibt stattdessen `jump_bonus`.
    jump_lookahead: 4           # wie viele Kacheln voraus geprueft werden
    jump_cost: 0.05             # Abzug pro Schritt A gehalten OHNE Grund voraus
    jump_bonus: 0.02            # Bonus pro Schritt A gehalten MIT Grund voraus
                                 # Falls nach einem Neu-Training immer noch staendig
                                 # gehoppelt wird: jump_cost hochdrehen (z.B. 0.08-0.15)
                                 # und/oder jump_bonus senken, bevor am Code etwas
                                 # geaendert wird.

    # Manche Hindernisse (hohe Pfeifen etc.) brauchen einen laenger gehaltenen,
    # hohen Sprung statt nur einen kurzen Hueper - Sprunghoehe haengt direkt
    # von der Haltedauer von A ab. Einmaliger Zusatzbonus, sobald A waehrend
    # eines erkannten Grundes so viele Schritte am Stueck gehalten wurde:
    sustained_jump_steps: 2   # nach wie vielen Schritten Dauerhalten der Bonus greift
    sustained_jump_bonus: 0.1   # Hoehe des einmaligen Zusatzbonus

    # Bonus fuers tatsaechliche Besiegen eines Gegners (Sprung drauf/Feuerball) -
    # unabhaengig vom gezielten Springen oben, reine Belohnung fuer den Erfolg.
    enemy_defeat_bonus: 5.0

    # Die AELTERE Gegner-Naehe-Strafe bleibt als Mechanik erhalten, ist aber
    # auf 0 gestellt: Sie hat vor dem gezielten Springen oben zum Dauerhoppeln
    # beigetragen (Springen war die einzige Moeglichkeit, ihr zu entgehen) und
    # wuerde jetzt denselben Fall doppelt bestrafen/belohnen. Nur bei Bedarf
    # (z.B. falls der Agent trotz gezieltem Springen zu nah an Gegner
    # herangeht) wieder hochdrehen (z.B. 0.05-0.1).
    enemy_danger_radius: 3
    enemy_proximity_penalty: 0.0

training:
  steps: 500000            # Gesamtzahl der Trainings-Zeitschritte
  envs: 4                  # Anzahl paralleler Emulator-Instanzen
  checkpoint_every: 25000  # Alle wie viele Schritte ein Checkpoint gespeichert wird
  run_name: mario_ppo      # Name fuer Checkpoint-Ordner und Tensorboard-Log

  # PPO-Hyperparameter (stable-baselines3), siehe
  # https://stable-baselines3.readthedocs.io/en/master/modules/ppo.html
  ppo:
    n_steps: 512
    batch_size: 256
    learning_rate: 0.00025
    gamma: 0.99
    ent_coef: 0.01

watch:
  episodes: 5   # Anzahl Episoden, die watch_agent.py standardmaessig zeigt
  speed: 1      # Emulationsgeschwindigkeit (1=normal, 0=ungebremst, max. 5)